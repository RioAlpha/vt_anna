<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribute — Puffin Travel Log</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Special+Elite&family=Caveat:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tartan-red: #c8102e;
            --tartan-green: #006747;
            --tartan-navy: #1a1a3e;
            --gold: #d4a843;
            --marshmallow: #fdf0e2;
            --puffin-orange: #e8652a;
            --soft-pink: #f7d1d5;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: var(--tartan-navy);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .back-nav {
            padding: 1.5rem 2rem;
        }
        .back-nav a {
            font-family: 'Special Elite', cursive;
            font-size: 0.9rem;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .back-nav a:hover { color: var(--puffin-orange); }

        .tartan-ribbon {
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(90deg,
                var(--tartan-red) 0px, var(--tartan-red) 12px,
                var(--tartan-navy) 12px, var(--tartan-navy) 16px,
                var(--tartan-green) 16px, var(--tartan-green) 28px,
                var(--tartan-navy) 28px, var(--tartan-navy) 32px);
        }

        .page-hero {
            text-align: center;
            padding: 3rem 2rem 2rem;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(200,16,46,0.15) 0%, transparent 60%),
                linear-gradient(180deg, var(--tartan-navy) 0%, #2a1a3e 100%);
        }
        .page-hero h1 {
            font-family: 'Special Elite', cursive;
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }
        .page-hero p {
            font-family: 'Caveat', cursive;
            font-size: 1.3rem;
            color: var(--soft-pink);
        }

        .form-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            flex: 1;
        }

        .form-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(212,168,67,0.25);
            border-radius: 16px;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-family: 'Special Elite', cursive;
            font-size: 0.85rem;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input[type="file"] {
            padding: 0.6rem;
            cursor: pointer;
        }
        .form-group input[type="file"]::file-selector-button {
            background: var(--puffin-orange);
            color: #fff;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            margin-right: 0.8rem;
            letter-spacing: 1px;
        }

        .file-note {
            font-family: 'Caveat', cursive;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.3rem;
        }

        .send-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--tartan-red), var(--puffin-orange));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Special Elite', cursive;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200,16,46,0.4);
        }

        .or-divider {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 1rem;
            color: rgba(255,255,255,0.3);
            margin: 1.5rem 0;
        }

        .mailto-note {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 1.05rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
            margin-top: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.3);
        }
        footer a {
            color: var(--gold);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .form-container { padding: 1rem; }
            .form-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<nav class="back-nav">
    <a href="adventures.html">← Back to adventures</a>
</nav>

<section class="page-hero">
    <h1>Contribute</h1>
    <p>Got photos or memories to share? Send them to us!</p>
</section>

<div class="tartan-ribbon"></div>

<div class="form-container">
    <div class="form-card">
        <form id="contributeForm">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="senderName" placeholder="Anonymous Puffin" value="Anonymous Puffin">
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" placeholder="e.g. Photos from our Scotland trip">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea id="body" placeholder="Tell us about these photos or memories..."></textarea>
            </div>

            <div class="form-group">
                <label>Attachments</label>
                <input type="file" id="attachments" multiple accept="image/*,.pdf,.zip">
                <p class="file-note">Images, PDFs, or zip files. Your email client will handle attachments.</p>
            </div>

            <button type="submit" class="send-btn">Send via Email</button>
        </form>

        <p class="mailto-note">
            This will open your email app with everything pre-filled.<br>
            Just hit send (and attach your files if needed)!
        </p>
    </div>
</div>

<div class="tartan-ribbon"></div>

<footer>
    <p><a href="adventures.html">← Back to adventures</a></p>
</footer>

<script>
    document.getElementById('contributeForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('senderName').value || 'Anonymous Puffin';
        const subject = document.getElementById('subject').value || 'Puffin Contribution';
        const body = document.getElementById('body').value || '';

        const fullBody = `From: ${name}\n\n${body}\n\n---\nSent from the Puffin Travel Log`;

        const mailtoLink = `mailto:sanvyawahare@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(fullBody)}`;

        window.location.href = mailtoLink;
    });
</script>

</body>
</html>
